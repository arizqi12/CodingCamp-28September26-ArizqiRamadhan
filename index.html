<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-top">
          <h1>Expense & Budget Visualizer</h1>
          <button id="theme-toggle" class="btn-theme" type="button">
            🌙 Dark Mode
          </button>
        </div>
        <div class="balance-card">
          <span class="balance-title">TOTAL BALANCE</span>
          <h2 id="total-balance">$0.00</h2>
        </div>
      </header>

      <section class="card">
        <h2>Add Transaction</h2>
        <form id="transaction-form">
          <div class="form-grid-row">
            <div class="form-group">
              <label for="item-name">Item Name</label>
              <input
                type="text"
                id="item-name"
                placeholder="e.g., Cilok"
                required
              />
            </div>
            <div class="form-group">
              <label for="item-amount">Amount</label>
              <input
                type="number"
                id="item-amount"
                step="0.01"
                placeholder="e.g., 14.94"
                required
              />
            </div>
            <div class="form-group">
              <label for="item-category">Category</label>
              <select id="item-category" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
            </div>
            <button type="submit" class="btn-primary">Add</button>
          </div>

          <div class="inline-custom-cat">
            <input
              type="text"
              id="new-category-input"
              placeholder="Or type new category name..."
            />
            <button type="button" id="add-category-btn" class="btn-secondary">
              + Add Category
            </button>
          </div>
        </form>
      </section>

      <div class="bottom-grid">
        <section class="card">
          <div class="section-header-row">
            <h2>Transactions</h2>
            <select id="sort-select" class="sort-dropdown">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="highest">Highest</option>
              <option value="lowest">Lowest</option>
            </select>
          </div>
          <div class="transactions-container">
            <ul id="transaction-list"></ul>
          </div>
        </section>

        <section class="card chart-card">
          <h2>Spending by Category</h2>
          <div class="canvas-container">
            <canvas id="spendingChart"></canvas>
          </div>
        </section>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
